name: Remediate dependency advisories

on:
  push:
    branches:
      - "improve/product-ready-ci"
    paths:
      - ".github/workflows/remediate-dependencies.yml"

permissions:
  contents: write

concurrency:
  group: dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Update vulnerable dependencies and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: improve/product-ready-ci

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Update Vitest to a patched release
        run: npm install --save-dev vitest@4.1.11 --package-lock-only --ignore-scripts

      - name: Apply compatible audit fixes
        run: npm audit fix

      - name: Install the updated lockfile
        run: npm ci

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high

      - name: Run full verification
        run: npm run verify

      - name: Commit verified dependency updates to the working branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate npm dependency advisories"
          git push origin HEAD:improve/product-ready-ci
